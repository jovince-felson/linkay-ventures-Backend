version: "3.8"

networks:
  backend:
    driver: bridge
    
  egress:
    driver: bridge

volumes:
  zookeeper_data:
  kafka_data:
  redis_data:
  mysql_data:
  admin_logs:
  auth_logs:
  user_logs:
  ekyc_logs:
  file_logs:
  file_uploads:
  notification_logs:
  api_gateway_logs:
  support_logs:
  referral_logs:
  socket_logs:
  subscription_logs:
  log_service_logs:
  risk_logs:
  account_logs:
  payment_logs:
  wallet_logs:
  ledger_logs:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - backend
    restart: unless-stopped
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # INTERNAL — used by other Docker containers (service-to-service)
      # EXTERNAL — used by PM2 services running on the host
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9093:9093"
    depends_on:
      zookeeper:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: linkey_auth
      MYSQL_USER: linkay_gateway_service
      MYSQL_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    container_name: api-gateway
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - services/api-gateway/.env
    volumes:
      - api_gateway_logs:/app/logs
    tmpfs:
      - /tmp
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

      

  auth-service:
    container_name: auth-service
    build:
      context: ./services/auth-services
      dockerfile: Dockerfile
    env_file:
      - services/auth-services/.env
    volumes:
      - auth_logs:/app/logs
    tmpfs:
      - /tmp
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ekyc-service:
    container_name: ekyc-service
    build:
      context: ./services/ekyc-services
      dockerfile: Dockerfile
    env_file:
      - services/ekyc-services/.env
    volumes:
      - ekyc_logs:/app/logs
    tmpfs:
      - /tmp
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  file-service:
    container_name: file-service
    build:
      context: ./services/file-service
      dockerfile: Dockerfile
    env_file:
      - services/file-service/.env
    volumes:
      - file_logs:/app/logs:rw
      - file_uploads:/app/uploads:rw
    tmpfs:
      - /tmp
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  notification-service:
    container_name: notification-service
    build:
      context: ./services/notification-services
      dockerfile: Dockerfile
    env_file:
      - ./services/notification-services/.env
    volumes:
      - notification_logs:/app/logs
    tmpfs:
      - /tmp
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
version: "3.8"

networks:
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  zookeeper_data:
  kafka_data:
  redis_data:
  mysql_data:
  auth_logs:
  ekyc_logs:
  file_logs:
  file_uploads:
  notification_logs:
  api_gateway_logs:
  asset_management_logs:

services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - backend
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_started
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: linkay_main
      MYSQL_USER: linkay
      MYSQL_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application Services ─────────────────────────────────────────────────────

  api-gateway:
    container_name: api-gateway
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./services/api-gateway/.env
    volumes:
      - api_gateway_logs:/app/logs
    tmpfs:
      - /tmp
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  auth-service:
    container_name: auth-service
    build:
      context: ./services/auth-services
      dockerfile: Dockerfile
    env_file:
      - ./services/auth-services/.env
    volumes:
      - auth_logs:/app/logs
    tmpfs:
      - /tmp
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

 
  notification-service:
    container_name: notification-service
    build:
      context: ./services/notification-services
      dockerfile: Dockerfile
    env_file:
      - ./services/notification-services/.env
    volumes:
      - notification_logs:/app/logs
    tmpfs:
      - /tmp
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  asset-management-service:
    container_name: asset-management-service
    build:
      context: ./services/asset-management-service
      dockerfile: Dockerfile
    env_file:
      - ./services/asset-management-service/.env
    volumes:
      - asset_management_logs:/app/logs
    tmpfs:
      - /tmp
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ekyc-service:
    container_name: ekyc-service
    build:
      context: ./services/ekyc-service
      dockerfile: Dockerfile
    env_file:
      - ./services/ekyc-service/.env
    volumes:
      - ekyc_logs:/app/logs
    tmpfs:
      - /tmp
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
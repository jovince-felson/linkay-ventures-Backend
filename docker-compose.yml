version: "3.8"

networks:
  backend:
    driver: bridge
  egress:
    driver: bridge

volumes:
  mysql_data:
  api_gateway_logs:
  auth_logs:

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: linkay_gateway_service
      MYSQL_USER: linkeydev
      MYSQL_PASSWORD: root123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    container_name: auth-service
    build:
      context: ./services/auth-services
      dockerfile: Dockerfile
    env_file:
      - services/auth-services/.env
    volumes:
      - auth_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
      - egress
    restart: unless-stopped

  api-gateway:
    container_name: api-gateway
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - services/api-gateway/.env
    volumes:
      - api_gateway_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - backend
      - egress
    restart: unless-stopped
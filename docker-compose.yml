version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: lv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: linkay_auth
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - linkay-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: lv-redis
    # ports:
    #   - "6379:6379"
    networks:
      - linkay-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: lv-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - linkay-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: lv-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - linkay-network

  auth-services:
    build: ./services/auth-services
    container_name: lv-auth-services
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: linkay_auth
      DB_USER: root
      DB_PASSWORD: rootpassword
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - linkay-network
    restart: unless-stopped

  ekyc-service:
    build: ./services/ekyc-services
    container_name: lv-ekyc-service
    env_file:
      - ./services/ekyc-services/.env
    ports:
      - "4004:4004"
    volumes:
      - ekyc_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - linkay-network
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    container_name: lv-api-gateway
    ports:
      - "3000:3000"
    env_file:
      - ./services/api-gateway/.env
    volumes:
      - api_gateway_logs:/app/logs
    depends_on:
      - kafka
      - redis
      - mysql
    networks:
      - linkay-network
    restart: unless-stopped

volumes:
  mysql_data:
  api_gateway_logs:
  ekyc_logs:

networks:
  linkay-network:
    driver: bridge
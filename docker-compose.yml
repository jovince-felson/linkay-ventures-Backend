version: '3.9'

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: lv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: linkay_auth
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - linkay-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Services ─────────────────────────────────────────────────────────────
  api-gateway:
    build: ./services/api-gateway
    container_name: lv-api-gateway
    ports:
      - "3000:3000"
    env_file: ./services/api-gateway/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  account-services:
    build: ./services/account-services
    container_name: lv-account-services
    ports:
      - "3001:3000"
    env_file: ./services/account-services/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  admin-services:
    build: ./services/admin-services
    container_name: lv-admin-services
    ports:
      - "3002:3000"
    env_file: ./services/admin-services/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  auth-services:
    build: ./services/auth-services
    container_name: lv-auth-services
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: linkay_auth
      DB_USER: root
      DB_PASSWORD: rootpassword
      JWT_SECRET: change_this_secret_in_production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: change_this_refresh_secret_in_production
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - linkay-network
    restart: unless-stopped

  ekyc-services:
    build: ./services/ekyc-services
    container_name: lv-ekyc-services
    ports:
      - "3004:3000"
    env_file: ./services/ekyc-services/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  file-service:
    build: ./services/file-service
    container_name: lv-file-service
    ports:
      - "3005:3000"
    env_file: ./services/file-service/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  log-services:
    build: ./services/log-services
    container_name: lv-log-services
    ports:
      - "3006:3000"
    env_file: ./services/log-services/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  notification-services:
    build: ./services/notification-services
    container_name: lv-notification-services
    ports:
      - "3007:3000"
    env_file: ./services/notification-services/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  payment-services:
    build: ./services/payment-services
    container_name: lv-payment-services
    ports:
      - "3008:3000"
    env_file: ./services/payment-services/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  referral-services:
    build: ./services/referral-services
    container_name: lv-referral-services
    ports:
      - "3009:3000"
    env_file: ./services/referral-services/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  risk-services:
    build: ./services/risk-services
    container_name: lv-risk-services
    ports:
      - "3010:3000"
    env_file: ./services/risk-services/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  socket-services:
    build: ./services/socket-services
    container_name: lv-socket-services
    ports:
      - "3011:3000"
    env_file: ./services/socket-services/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  subscription-services:
    build: ./services/subscription-services
    container_name: lv-subscription-services
    ports:
      - "3012:3000"
    env_file: ./services/subscription-services/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  support-services:
    build: ./services/support-services
    container_name: lv-support-services
    ports:
      - "3013:3000"
    env_file: ./services/support-services/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  user-services:
    build: ./services/user-services
    container_name: lv-user-services
    ports:
      - "3014:3000"
    env_file: ./services/user-services/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

  wallet-services:
    build: ./services/wallet-services
    container_name: lv-wallet-services
    ports:
      - "3015:3000"
    env_file: ./services/wallet-services/.env.example
    networks:
      - linkay-network
    restart: unless-stopped

networks:
  linkay-network:
    driver: bridge

volumes:
  mysql_data:

services:

  mysql:
    image: mysql:8.0
    container_name: lv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: linkay_auth
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - linkay-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-services:
    build: ./services/auth-services
    container_name: lv-auth-services
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: linkay_auth
      DB_USER: root
      DB_PASSWORD: rootpassword
      JWT_SECRET: change_this_secret_in_production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: change_this_refresh_secret_in_production
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - linkay-network
    restart: unless-stopped

networks:
  linkay-network:
    driver: bridge

volumes:
  mysql_data:
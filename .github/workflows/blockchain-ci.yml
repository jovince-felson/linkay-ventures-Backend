name: Blockchain CI

on:
  push:
    paths:
      - "blockchain/**"
  pull_request:
    paths:
      - "blockchain/**"

defaults:
  run:
    working-directory: blockchain

jobs:
  build-and-test:
    name: forge build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes

      - name: Run tests
        run: forge test -v

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Coverage (>=80% required)
        run: |
          forge coverage --report lcov
          COVERAGE=$(lcov --summary lcov.info 2>&1 | grep "lines" | grep -o '[0-9.]*%' | head -1 | tr -d '%')
          echo "Line coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov+0 < 80) { print "Coverage " cov "% below 80% threshold"; exit 1 } }'

      - name: Gas snapshot diff
        run: forge snapshot --diff || true

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for Slither
        run: forge build

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: blockchain/
          slither-args: --exclude-dependencies --filter-paths "lib/"
          fail-on: high
          ignore-compile: false
